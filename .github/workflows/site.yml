name: Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_FORMSPREE_ID: ${{ vars.PUBLIC_FORMSPREE_ID }}
      BANNED_TERMS: ${{ secrets.BANNED_TERMS }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check

      # The banned-terms list is a secret, so pull requests from forks, which
      # cannot read it, are checked when they reach main instead.
      - name: Check the source for banned terms
        if: env.BANNED_TERMS != ''
        run: node scripts/check-terms.mjs

      - run: npm run build
      - run: npm run check
        env:
          CI: ${{ env.BANNED_TERMS != '' && 'true' || '' }}

      - run: npx playwright install --with-deps chromium
      # Includes the accessibility checks (WCAG 2.2 AA, every page, both themes).
      - run: npm test
        env:
          CI: 'true'

      # Speed, accessibility, best practice and SEO scores; thresholds in lighthouserc.json.
      - name: Lighthouse
        run: npm run lighthouse

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/reports
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
