name: Uptime

# Every 15 minutes, from outside: this site answers over https, and so does
# the hosted service's health check (once PUBLIC_APP_URL is set), each with a
# certificate that has more than 14 days left. A failed run emails whoever
# last changed the schedule below; nothing else is posted. See README, Uptime.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: https://mdxplora.com/
      APP_URL: ${{ vars.PUBLIC_APP_URL }}
    steps:
      - name: Check the site and the service
        run: |
          set -u
          failed=0

          # $1: a name for the log, $2: an https address, $3: the body it must
          # give, or empty for any. Three tries, 20 s apart, so a restart is
          # not an outage.
          check() {
            local host tries=0 body=""
            host="${2#https://}"
            host="${host%%/*}"
            while [ "${tries}" -lt 3 ]; do
              tries=$((tries + 1))
              if body="$(curl --fail --silent --show-error --proto '=https' --max-time 20 "$2")"; then
                break
              fi
              body="(no answer)"
              [ "${tries}" -lt 3 ] && sleep 20
            done
            if [ "${body}" = "(no answer)" ] || { [ -n "$3" ] && [ "${body}" != "$3" ]; }; then
              echo "::error::$1 at $2 is not answering as it should."
              failed=1
              return
            fi
            if ! echo | openssl s_client -connect "${host}:443" -servername "${host}" 2>/dev/null \
                | openssl x509 -noout -checkend $((14 * 86400)) >/dev/null; then
              echo "::error::$1: the certificate for ${host} ends within 14 days."
              failed=1
              return
            fi
            echo "$1 is up; its certificate has more than 14 days left."
          }

          check "The site" "${SITE_URL}" ""
          if [ -n "${APP_URL}" ]; then
            check "The service" "${APP_URL%/}/_mdx/health" "ok"
          else
            echo "PUBLIC_APP_URL is not set, so the service is not checked."
          fi
          exit "${failed}"
