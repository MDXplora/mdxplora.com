# Weekly dependency updates. Minor and patch updates arrive together in one pull
# request per ecosystem; a major update gets its own, and so does any parse5
# update. New releases wait a week before they are proposed, so a bad release is
# usually withdrawn first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
        # The link check's notes on parse5 are tied to its version (see DEVELOPMENT.md).
        exclude-patterns: ['parse5']
        update-types: [minor, patch]
    ignore:
      # Kept at 0.7.5 by an override: satori cannot read fonts with 0.8, so every preview image shows boxes.
      - dependency-name: fflate
        versions: ['>= 0.8.0']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
